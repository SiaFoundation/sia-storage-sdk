name: Prepare Release

on:
  push:
    branches: [master]
  workflow_dispatch:

# Serialize updates to the bot-owned release branch. Always prepare from the
# latest master, including when an older run was queued.
concurrency: prepare-release

permissions:
  contents: read

jobs:
  prepare-release:
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Check for pending changes
        id: changes
        run: |
          if compgen -G '.changeset/*.md' > /dev/null; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      # Like sia-storage-js, use the existing CI app so the release PR triggers
      # normal CI. GITHUB_TOKEN-created PRs do not trigger those workflows.
      - name: Mint bot token
        if: steps.changes.outputs.pending == 'true'
        id: bot-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.SIA_CI_BOT_APP_ID }}
          private-key: ${{ secrets.SIA_CI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        if: steps.changes.outputs.pending == 'true'
        with:
          ref: ${{ steps.changes.outputs.sha }}
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.changes.outputs.pending == 'true'
        with:
          python-version: '3.12'
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        if: steps.changes.outputs.pending == 'true'
        with:
          version: 0.22.2
      - name: Prepare versions and changelog
        if: steps.changes.outputs.pending == 'true'
        run: |
          python3 .github/scripts/check_changesets.py
          git switch -c release
          knope prepare-release --verbose
      - name: Install Rust
        if: steps.changes.outputs.pending == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Cargo
        if: steps.changes.outputs.pending == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Build and test the release XCFramework
        if: steps.changes.outputs.pending == 'true'
        run: |
          ./swift/build.sh
          git diff --exit-code -- Cargo.lock
          SIA_STORAGE_SDK_USE_LOCAL_XCFRAMEWORK=1 swift build
          (cd examples/swift && SIA_STORAGE_SDK_USE_LOCAL_XCFRAMEWORK=1 swift build)
      - name: Record the exact release artifact
        if: steps.changes.outputs.pending == 'true'
        id: artifact
        run: |
          python3 .github/scripts/swift_release.py prepare \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 .github/scripts/swift_release.py verify
          python3 .github/scripts/swift_release.py metadata >> "$GITHUB_OUTPUT"
      - name: Retain the release artifact
        if: steps.changes.outputs.pending == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: build/release/
          if-no-files-found: error
          retention-days: 90
      - name: Update release pull request
        if: steps.changes.outputs.pending == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.bot-token.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore: prepare release $(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          git push --force-with-lease --set-upstream origin release
          knope release-pull-request
