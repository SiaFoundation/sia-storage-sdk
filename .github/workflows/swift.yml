name: Swift SDK build

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-version:
        description: 'Smoke test an already published, immutable release'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    if: inputs.release-version == ''
    name: Build XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: .

      - name: Build XCFramework
        run: ./swift/build.sh

      - name: Upload XCFramework
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SiaStorageSDKFFI-xcframework
          path: build/SiaStorageSDKFFI.xcframework.zip

      - name: Compute and save checksum
        run: |
          CHECKSUM=$(swift package compute-checksum build/SiaStorageSDKFFI.xcframework.zip)
          echo "$CHECKSUM" > checksum.txt
          echo "Checksum: $CHECKSUM"

      - name: Upload checksum
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: checksum
          path: checksum.txt

  test:
    name: Test Swift package
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download XCFramework
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: SiaStorageSDKFFI-xcframework
          path: build

      - name: Extract XCFramework
        run: unzip -q build/SiaStorageSDKFFI.xcframework.zip -d build

      - name: Build package
        run: SIA_STORAGE_SDK_USE_LOCAL_XCFRAMEWORK=1 swift build

      - name: Build example
        run: |
          cd examples/swift
          SIA_STORAGE_SDK_USE_LOCAL_XCFRAMEWORK=1 swift build

      - name: Build downstream consumer package
        run: |
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          swift package init --type executable
          rm -rf Sources/*
          mkdir -p Sources/ConsumerSmoke
          cat > Package.swift <<EOF
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "ConsumerSmoke",
              platforms: [
                  .iOS(.v16),
                  .macOS(.v14)
              ],
              dependencies: [
                  .package(path: "${GITHUB_WORKSPACE}")
              ],
              targets: [
                  .executableTarget(
                      name: "ConsumerSmoke",
                      dependencies: [
                          .product(name: "SiaStorageSDK", package: "sia-storage-sdk")
                      ]
                  )
              ]
          )
          EOF
          cat > Sources/ConsumerSmoke/main.swift <<'EOF'
          import SiaStorageSDK
          import Foundation

          let _ = try Builder(indexerUrl: "https://sia.storage", appMeta: AppMetadata(id: Data(repeating: 0x01, count: 32), name: "smoke test", description: "smoke test", serviceUrl: "https://example.com", logoUrl: nil, callbackUrl: nil))
          print("consumer smoke build ok")
          EOF
          SIA_STORAGE_SDK_USE_LOCAL_XCFRAMEWORK=1 swift build

  smoke-test-release:
    name: Smoke test published release
    runs-on: macos-15
    if: inputs.release-version != ''
    steps:
      - name: Build downstream package from released tag
        env:
          VERSION: ${{ inputs.release-version }}
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable major.minor.patch release version" >&2
            exit 1
          fi
          TMP_DIR="$(mktemp -d)"
          cd "$TMP_DIR"
          swift package init --type executable
          rm -rf Sources/*
          mkdir -p Sources/ReleaseSmoke
          cat > Package.swift <<EOF
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "ReleaseSmoke",
              platforms: [
                  .iOS(.v16),
                  .macOS(.v14)
              ],
              dependencies: [
                  .package(url: "https://github.com/SiaFoundation/sia-storage-sdk", exact: "$VERSION")
              ],
              targets: [
                  .executableTarget(
                      name: "ReleaseSmoke",
                      dependencies: [
                          .product(name: "SiaStorageSDK", package: "sia-storage-sdk")
                      ]
                  )
              ]
          )
          EOF
          cat > Sources/ReleaseSmoke/main.swift <<'EOF'
          import SiaStorageSDK
          import Foundation

          let _ = try Builder(indexerUrl: "https://sia.storage", appMeta: AppMetadata(id: Data(repeating: 0x01, count: 32), name: "smoke test", description: "smoke test", serviceUrl: "https://example.com", logoUrl: nil, callbackUrl: nil))
          print("release smoke build ok")
          EOF

          for ATTEMPT in 1 2 3 4 5; do
            if swift build; then
              exit 0
            fi
            echo "Retrying release smoke test ($ATTEMPT/5)..."
            swift package reset || true
            rm -rf .build
            sleep 10
          done

          echo "Release smoke test failed after retries"
          exit 1
