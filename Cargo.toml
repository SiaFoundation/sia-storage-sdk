[package]
name = "sia_storage_sdk"
version = "0.13.0"
edition = "2024"
repository = "https://github.com/SiaFoundation/sia-storage-sdk"
license = "MIT"
description = "UniFFI bindings for the Sia Storage SDK"
authors = ["The Sia Foundation"]

[lib]
name = "sia_storage_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
sia_storage_ffi = { git = "https://github.com/SiaFoundation/sia-sdk-rs.git", rev = "6dbcf47db821b04fedf8a1965ae140adb868be30" }
uniffi = { version = "=0.31.1", features = ["cli", "tokio"] }

[[bin]]
name = "uniffi-bindgen"
